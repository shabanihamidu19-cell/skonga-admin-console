<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SKONGA Admin</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-left">
        <span class="mark">S</span>
        <span class="product">SKONGA <em>Admin</em></span>
      </div>
      <div class="search-wrap">
        <input type="search" id="global-search" placeholder="Search users, reports, feedback…" autocomplete="off" />
      </div>
      <div class="topbar-right">
        <span class="chip">design · mock</span>
        <span class="chip accent">Super admin</span>
      </div>
    </header>

    <div class="body">
      <aside class="sidebar">
        <nav id="nav">
          <p class="nav-label">Operate</p>
          <button type="button" data-view="overview" class="active">Overview</button>
          <button type="button" data-view="users">Users</button>
          <button type="button" data-view="usage">Usage</button>
          <p class="nav-label">Quality</p>
          <button type="button" data-view="feedback">Feedback</button>
          <button type="button" data-view="reports">Reports</button>
          <p class="nav-label">Platform</p>
          <button type="button" data-view="library">Library</button>
          <button type="button" data-view="learn">Learn</button>
          <button type="button" data-view="system">System</button>
          <button type="button" data-view="settings">Settings</button>
        </nav>
        <p class="sidebar-note">Not connected to production</p>
      </aside>

      <main class="content">
        <div class="content-head">
          <div>
            <h1 id="page-title">Overview</h1>
            <p id="page-sub" class="sub">Platform snapshot</p>
          </div>
        </div>
        <div id="view"></div>
      </main>
    </div>
  </div>
  <script src="mock-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
