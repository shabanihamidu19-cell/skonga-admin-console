<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SKONGA Admin Console</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">S</div>
        <div>
          <strong>SKONGA</strong>
          <span>Admin Console</span>
        </div>
      </div>
      <nav id="nav">
        <button type="button" data-view="overview" class="active">Overview</button>
        <button type="button" data-view="users">Users</button>
        <button type="button" data-view="usage">Usage</button>
        <button type="button" data-view="library">Library</button>
        <button type="button" data-view="learn">Learn</button>
        <button type="button" data-view="feedback">Feedback</button>
        <button type="button" data-view="reports">Reports</button>
        <button type="button" data-view="system">System</button>
        <button type="button" data-view="settings">Settings</button>
      </nav>
      <div class="sidebar-foot">
        <span class="badge">MOCK DATA</span>
        <span class="muted">Not connected to production</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="page-title">Overview</h1>
          <p class="muted" id="page-sub">Platform snapshot</p>
        </div>
        <div class="topbar-right">
          <span class="env">env: design</span>
          <span class="admin-chip">Super admin</span>
        </div>
      </header>

      <div id="view" class="view"></div>
    </main>
  </div>

  <div id="drawer" class="drawer hidden" aria-hidden="true">
    <div class="drawer-panel">
      <div class="drawer-head">
        <h2 id="drawer-title">Detail</h2>
        <button type="button" id="drawer-close" class="btn ghost">Close</button>
      </div>
      <div id="drawer-body" class="drawer-body"></div>
    </div>
  </div>

  <script src="mock-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
